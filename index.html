<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kopfrechen-Challenge · Zehnerzahlen</title>
<style>
:root{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;color:#14233d;background:#eef4fc}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:18px}.app{width:min(100%,640px);background:white;border-radius:26px;padding:clamp(20px,5vw,36px);box-shadow:0 16px 50px #1c3f7622}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.eyebrow{font-size:13px;color:#587195;font-weight:700;letter-spacing:.08em;text-transform:uppercase}h1{margin:4px 0 0;font-size:clamp(24px,5vw,34px)}.count{background:#e8f0ff;border-radius:30px;padding:9px 13px;font-weight:800;white-space:nowrap}.progress{height:10px;background:#e7edf7;border-radius:12px;overflow:hidden;margin:24px 0}.progress>div{height:100%;background:#3777df;transition:width .2s}.question{background:#f1f6ff;border:2px solid #dfeafd;border-radius:20px;padding:32px 12px;text-align:center;font-size:clamp(40px,9vw,68px);font-weight:850;font-variant-numeric:tabular-nums;letter-spacing:.02em}.tip{margin:16px 0;padding:16px;border:2px dashed #c0d5f6;border-radius:16px;background:#f7fbff;text-align:center}.tip strong{display:block;font-size:27px;margin:5px 0}.tip p{margin:4px 0;color:#456184}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}button{cursor:pointer;border:0;border-radius:14px;padding:15px 18px;font:inherit;font-weight:800;min-height:52px}button:focus-visible,input:focus-visible{outline:3px solid #f2a900;outline-offset:3px}.secondary{background:#e8f0ff;color:#1c4c9a}.primary{background:#2566d4;color:white;flex:1}.primary:disabled{background:#a4b4cc;cursor:not-allowed}.answer{display:flex;gap:10px;margin-top:20px}.answer input{width:100%;min-width:0;border:2px solid #a9c2e7;border-radius:14px;font-size:28px;padding:10px 15px;text-align:center}.feedback{font-weight:750;margin-top:14px;min-height:28px}.good{color:#176a42}.retry{color:#9a4b15}.muted{color:#587195}.footer{margin-top:24px;text-align:center;font-size:13px;color:#607590}.setup{display:grid;gap:14px;margin-top:24px}.choice{width:100%;text-align:left;border:2px solid #c8d9f3;background:#f5f9ff;color:#17365f;padding:20px}.choice strong{display:block;font-size:20px;margin-bottom:5px}.choice span{font-size:15px;font-weight:500}.choice:hover{border-color:#2566d4}.end{text-align:center;padding:22px 0}.end h2{font-size:32px}.end p{font-size:18px;line-height:1.5}.results{width:100%;border-collapse:collapse;margin:18px 0;text-align:left;font-size:15px}.results th,.results td{padding:10px 7px;border-bottom:1px solid #e2ebf8}.results th{background:#edf5ff}.results tr.correct td:last-child{color:#176a42;font-weight:800}.results tr.incorrect td:last-child{color:#9a4b15;font-weight:800}.results-wrap{overflow-x:auto}.result-summary{font-size:24px;font-weight:850;color:#1d559e;margin:15px 0}.solution-line{margin-top:8px;font-size:19px;font-weight:800;color:#183d72}.answer input:disabled{background:#f3f6fa;color:#263e5d}@media(max-width:430px){.answer{flex-direction:column}.question{padding:25px 8px}}
/* Dezente, kindgerechte Gestaltung – ohne externe Bilddateien */
body{background:radial-gradient(circle at 12% 14%,#fff5c9 0 5%,transparent 24%),radial-gradient(circle at 88% 85%,#dbeeff 0 8%,transparent 30%),#edf5ff}
.app{position:relative;overflow:hidden;border:2px solid #e5eefc;box-shadow:0 18px 48px #305b9020}
.app::before{content:"";position:absolute;top:0;left:0;right:0;height:7px;background:linear-gradient(90deg,#76c8f4,#fbd46c,#ffb9a3,#a8dcba)}
.eyebrow{color:#52759c}.question{background:#f0f7ff;border-color:#d4e7ff}.progress>div{background:linear-gradient(90deg,#4b99df,#79c8b3)}
.choice{transition:transform .15s,border-color .15s}.choice:hover{transform:translateY(-2px)}
.illustration{width:72px;height:72px;flex:none}.illustration.small{width:46px;height:46px}.hero{display:flex;align-items:center;gap:13px;margin-top:8px}.hero h1{margin:0}.decor-row{display:flex;justify-content:center;align-items:center;gap:13px;margin:10px 0 2px}.decor-star{width:22px;height:22px}.end-illustration{width:112px;height:112px;margin:0 auto}.tip-title{display:flex;justify-content:center;align-items:center;gap:7px}.tip-title svg{width:24px;height:24px}
@media(max-width:430px){.illustration{width:54px;height:54px}.illustration.small{width:38px;height:38px}.hero{gap:8px}}
.result-list{display:grid;gap:9px;margin-top:12px}.result-item{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:13px 15px;border-radius:14px;background:#f5f9ff;border:1px solid #dce8f8}.result-number{font-weight:800;min-width:88px}.result-status{font-weight:800}.result-detail{margin-left:auto;font-weight:750}.result-own{flex-basis:100%;font-size:13px;color:#72502b}.result-item.correct .result-status{color:#176a42}.result-item.incorrect{background:#fff8f0;border-color:#f2dec6}.result-item.incorrect .result-status{color:#9a4b15}.result-item.unanswered{background:#f3f5f8;border-color:#dce2e9}.result-item.unanswered .result-status{color:#63748a}.result-item.unanswered{background:#f4f5f7;border-color:#dce1e8}.result-item.unanswered .result-status{color:#637184}@media(max-width:430px){.result-detail{margin-left:0;width:100%}}
</style>
</head>
<body><main class="app" id="app" aria-live="polite"></main>
<script>
'use strict';
// Alle Kinder erhalten dieselben 20 Aufgaben in derselben Reihenfolge.
const tasks=[
 {a:90,op:'−',b:30,small:'9 − 3 = ?'},
 {a:40,op:'+',b:20,small:'4 + 2 = ?'},
 {a:80,op:'−',b:50,small:'8 − 5 = ?'},
 {a:30,op:'+',b:60,small:'3 + 6 = ?'},
 {a:70,op:'−',b:40,small:'7 − 4 = ?'},
 {a:50,op:'+',b:30,small:'5 + 3 = ?'},
 {a:60,op:'−',b:20,small:'6 − 2 = ?'},
 {a:20,op:'+',b:70,small:'2 + 7 = ?'},
 {a:100,op:'−',b:60,small:'10 − 6 = ?'},
 {a:40,op:'+',b:50,small:'4 + 5 = ?'},
 {a:70,op:'+',b:20,small:'7 + 2 = ?'},
 {a:90,op:'−',b:50,small:'9 − 5 = ?'},
 {a:30,op:'+',b:40,small:'3 + 4 = ?'},
 {a:80,op:'−',b:20,small:'8 − 2 = ?'},
 {a:20,op:'+',b:50,small:'2 + 5 = ?'},
 {a:100,op:'−',b:30,small:'10 − 3 = ?'},
 {a:60,op:'+',b:30,small:'6 + 3 = ?'},
 {a:70,op:'−',b:50,small:'7 − 5 = ?'},
 {a:40,op:'+',b:30,small:'4 + 3 = ?'},
 {a:90,op:'−',b:70,small:'9 − 7 = ?'}
];
let idx=0,tip=false,done=false,mode=null,finished=false,timedOut=false;
let deadline=null,timerHandle=null;const DURATION=4*60*1000;const answers=[];
function stopTimer(){if(timerHandle!==null){clearTimeout(timerHandle);timerHandle=null}}
function finish(expired=false){
 if(finished)return;
 // Auch eine bereits eingetippte, aber noch nicht geprüfte Antwort bleibt unbearbeitet.
 finished=true;timedOut=expired;stopTimer();idx=tasks.length;render();
}
function checkTime(){if(!finished&&deadline!==null&&Date.now()>=deadline){finish(true);return true}return false}
function startTimer(){stopTimer();deadline=Date.now()+DURATION;timerHandle=setInterval(checkTime,250)}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)checkTime()});
window.addEventListener('focus',checkTime);

const app=document.getElementById('app');
// Eigene, direkt eingebettete Cliparts: keine Downloads, keine externen Quellen.
const pencil=`<svg class="illustration" viewBox="0 0 90 90" role="img" aria-label="Bunter Bleistift"><g transform="rotate(32 45 45)"><rect x="31" y="13" width="28" height="56" rx="5" fill="#ffd76d" stroke="#b47e34" stroke-width="2"/><rect x="31" y="13" width="8" height="56" fill="#ffb5a8"/><rect x="50" y="13" width="9" height="56" fill="#8bd1e9"/><rect x="31" y="8" width="28" height="13" rx="5" fill="#f5a4b6" stroke="#b47e34" stroke-width="2"/><path d="M31 69L45 85 59 69Z" fill="#f5d2a6" stroke="#b47e34" stroke-width="2"/><path d="M40 80L45 85 50 80Z" fill="#53505a"/></g></svg>`;
const star=`<svg class="decor-star" viewBox="0 0 32 32" aria-hidden="true"><path d="M16 2l4.3 9 9.8 1.4-7.1 6.9 1.7 9.7L16 24.4 7.3 29l1.7-9.7-7.1-6.9 9.8-1.4z" fill="#f7c85a" stroke="#dfa33b" stroke-width="1.5"/></svg>`;
const bulb=`<svg viewBox="0 0 32 32" aria-hidden="true"><path d="M16 3a10 10 0 0 0-6 18c1.5 1.2 2 2.7 2 4h8c0-1.3.5-2.8 2-4a10 10 0 0 0-6-18z" fill="#ffe17e" stroke="#d49a26" stroke-width="2"/><path d="M12 27h8m-7 3h6" stroke="#62738b" stroke-width="2.5" stroke-linecap="round"/></svg>`;
const trophy=`<svg class="end-illustration" viewBox="0 0 120 120" role="img" aria-label="Goldener Siegerpokal"><path d="M38 22h44v29c0 21-12 32-22 32S38 72 38 51z" fill="#ffd36d" stroke="#ba812b" stroke-width="3"/><path d="M38 30H23v13c0 14 10 20 23 20M82 30h15v13c0 14-10 20-23 20" fill="none" stroke="#d49a38" stroke-width="7" stroke-linejoin="round"/><path d="M60 83v14m-21 9h42" stroke="#ba812b" stroke-width="8" stroke-linecap="round"/><path d="M60 35l5 10 11 1.5-8 8 2 11-10-5-10 5 2-11-8-8 11-1.5z" fill="#fff5cc"/></svg>`;
function solution(t){return t.op==='+'?t.a+t.b:t.a-t.b}
function render(){
 if(mode!==null&&!finished&&checkTime())return;
 if(mode===null){app.innerHTML=`<div class="eyebrow">Mathematik · 2. Klasse</div><div class="hero">${pencil}<h1>⚡ Kopfrechen-Challenge</h1></div><div class="decor-row">${star}${star}${star}</div><p class="muted">20 Aufgaben mit Zehnerzahlen. Wähle deine Variante:</p><div class="setup"><button class="choice" id="withTip"><strong>💡 Mit Tippfeld</strong><span>Du kannst dir bei jeder Aufgabe die kleine Rechnung anzeigen lassen.</span></button><button class="choice" id="withoutTip"><strong>🧠 Ohne Tippfeld</strong><span>Du rechnest alle Aufgaben ohne zusätzliche Hilfe.</span></button></div><div class="footer">Alle bearbeiten dieselben 20 Aufgaben.</div>`;document.getElementById('withTip').onclick=()=>{mode='tip';startTimer();render()};document.getElementById('withoutTip').onclick=()=>{mode='no-tip';startTimer();render()};return}
 if(finished||idx>=tasks.length){
   if(!finished){finished=true;stopTimer()}
  const score=answers.filter(a=>a.correct).length;
  const rows=tasks.map((t,i)=>{
   const a=answers[i];
   return `<div class="result-item ${!a?'unanswered':a.correct?'correct':'incorrect'}"><span class="result-number">Aufgabe ${i+1}</span><span class="result-status">${!a?'– Offen':a.correct?'✓ Richtig':'✗ Falsch'}</span><span class="result-detail">${t.a} ${t.op} ${t.b} = ${solution(t)}</span>${!a?'':a.correct?'':`<span class="result-own">Deine Antwort: ${a.value}</span>`}</div>`;
  }).join('');
  app.innerHTML=`<div class="eyebrow">Geschafft!</div><section class="end">${trophy}<h2>Super gemacht! 🎉</h2><p>${timedOut?'Die 4 Minuten sind vorbei!':'Du hast alle Aufgaben bearbeitet!'}</p><div class="result-summary">${score} von ${tasks.length} Aufgaben richtig</div><p>${answers.filter(Boolean).length} bearbeitet · ${tasks.length-answers.filter(Boolean).length} offen</p><p>Deine Endkontrolle:</p></section><div class="result-list">${rows}</div><button class="primary" id="again" style="width:100%;margin-top:20px">Noch einmal spielen</button><div class="footer">Kopfrechen-Challenge · Zahlenraum bis 100</div>`;
  document.getElementById('again').onclick=()=>{stopTimer();idx=0;answers.length=0;tip=false;done=false;mode=null;finished=false;timedOut=false;deadline=null;render()};return
 }

 const t=tasks[idx];const result=answers[idx];app.innerHTML=`<div class="top"><div><div class="eyebrow">Mathematik · Zehnerzahlen</div><div class="hero">${pencil}<h1>⚡ Kopfrechen-Challenge</h1></div></div><div class="count">${idx+1} / ${tasks.length}</div></div><div class="progress" aria-label="Fortschritt"><div style="width:${idx/tasks.length*100}%"></div></div><div class="question" aria-label="Rechenaufgabe">${t.a} ${t.op} ${t.b} = ?</div>${mode==='tip'&&!done?`<div class="actions"><button type="button" class="secondary" id="tipBtn" aria-expanded="${tip}">💡 ${tip?'Tipp ausblenden':'Tipp anzeigen'}</button></div>`:''}${tip?`<div class="tip" id="tip"><div class="tip-title">${bulb}<span>Deine kleine Aufgabe:</span></div><strong>${t.small}</strong><p>Überlege: Wie hilft dir das bei den Zehnern?</p></div>`:''}<label for="answer" style="display:block;margin-top:20px;font-weight:800">Dein Ergebnis:</label><form class="answer" id="form"><input id="answer" type="number" min="0" max="100" step="10" inputmode="numeric" autocomplete="off" ${done?'disabled':''} aria-label="Ergebnis eingeben" required><button class="primary" id="check" type="submit" ${done?'disabled':''}>Prüfen</button></form><div class="feedback" id="feedback" role="status">${done?`<span class="${result.correct?'good':'retry'}">${result.correct?'✓ Richtig gerechnet!':'✗ Noch nicht richtig.'}</span><div class="solution-line">Die richtige Zahl ist: ${solution(t)}</div>`:''}</div>${done?'<div class="actions"><button class="primary" id="next">'+(idx===tasks.length-1?'Meine Ergebnisse ansehen':'Nächste Aufgabe →')+'</button></div>':''}<div class="footer">${mode==='tip'?'Du kannst dir bei Bedarf einen Tipp holen. 🌟':'Du rechnest selbstständig. Viel Erfolg! 🌟'}</div>`;
 if(done)document.getElementById('answer').value=result.value;
 if(mode==='tip'&&!done)document.getElementById('tipBtn').onclick=()=>{const current=document.getElementById('answer')?.value||'';tip=!tip;render();const input=document.getElementById('answer');if(input)input.value=current};
 if(!done)document.getElementById('form').onsubmit=e=>{e.preventDefault();const input=document.getElementById('answer');if(checkTime())return;if(input.value.trim()==='')return;const value=Number(input.value);answers[idx]={value,correct:value===solution(t)};done=true;render()};
 if(done)document.getElementById('next').onclick=()=>{if(checkTime())return;idx++;tip=false;done=false;if(idx>=tasks.length)finish(false);else render()};
}
render();
</script></body></html>
