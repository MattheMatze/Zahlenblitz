<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kopfrechen-Challenge · Zehnerzahlen</title>
<style>
:root{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;color:#14233d;background:#eef4fc}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:18px}.app{width:min(100%,640px);background:white;border-radius:26px;padding:clamp(20px,5vw,36px);box-shadow:0 16px 50px #1c3f7622}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.eyebrow{font-size:13px;color:#587195;font-weight:700;letter-spacing:.08em;text-transform:uppercase}h1{margin:4px 0 0;font-size:clamp(24px,5vw,34px)}.count{background:#e8f0ff;border-radius:30px;padding:9px 13px;font-weight:800;white-space:nowrap}.progress{height:10px;background:#e7edf7;border-radius:12px;overflow:hidden;margin:24px 0}.progress>div{height:100%;background:#3777df;transition:width .2s}.question{background:#f1f6ff;border:2px solid #dfeafd;border-radius:20px;padding:32px 12px;text-align:center;font-size:clamp(40px,9vw,68px);font-weight:850;font-variant-numeric:tabular-nums;letter-spacing:.02em}.tip{margin:16px 0;padding:16px;border:2px dashed #c0d5f6;border-radius:16px;background:#f7fbff;text-align:center}.tip strong{display:block;font-size:27px;margin:5px 0}.tip p{margin:4px 0;color:#456184}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}button{cursor:pointer;border:0;border-radius:14px;padding:15px 18px;font:inherit;font-weight:800;min-height:52px}button:focus-visible,input:focus-visible{outline:3px solid #f2a900;outline-offset:3px}.secondary{background:#e8f0ff;color:#1c4c9a}.primary{background:#2566d4;color:white;flex:1}.primary:disabled{background:#a4b4cc;cursor:not-allowed}.answer{display:flex;gap:10px;margin-top:20px}.answer input{width:100%;min-width:0;border:2px solid #a9c2e7;border-radius:14px;font-size:28px;padding:10px 15px;text-align:center}.feedback{font-weight:750;margin-top:14px;min-height:28px}.good{color:#176a42}.retry{color:#9a4b15}.muted{color:#587195}.footer{margin-top:24px;text-align:center;font-size:13px;color:#607590}.end{text-align:center;padding:22px 0}.end h2{font-size:32px}.end p{font-size:18px;line-height:1.5}@media(max-width:430px){.answer{flex-direction:column}.question{padding:25px 8px}}
</style>
</head>
<body><main class="app" id="app" aria-live="polite"></main>
<script>
'use strict';
// Alle Kinder erhalten dieselben sechs Aufgaben in derselben Reihenfolge.
const tasks=[
 {a:90,op:'−',b:30,small:'9 − 3 = ?'},
 {a:40,op:'+',b:20,small:'4 + 2 = ?'},
 {a:80,op:'−',b:50,small:'8 − 5 = ?'},
 {a:30,op:'+',b:60,small:'3 + 6 = ?'},
 {a:70,op:'−',b:40,small:'7 − 4 = ?'},
 {a:50,op:'+',b:30,small:'5 + 3 = ?'}
];
let idx=0,tip=false,done=false,attempted=false,firstTryCorrect=0,firstAttempt=true;
const app=document.getElementById('app');
function solution(t){return t.op==='+'?t.a+t.b:t.a-t.b}
function render(){
 if(idx>=tasks.length){app.innerHTML=`<div class="eyebrow">Geschafft!</div><section class="end"><div style="font-size:56px">🎉</div><h2>Super gerechnet!</h2><p>Du hast alle <strong>6 Aufgaben</strong> bearbeitet.</p><p class="muted">Davon waren ${firstTryCorrect} beim ersten Versuch richtig.</p><button class="primary" id="again">Noch einmal spielen</button></section><div class="footer">Kopfrechen-Challenge · Zahlenraum bis 100</div>`;document.getElementById('again').onclick=()=>{idx=0;firstTryCorrect=0;tip=false;done=false;attempted=false;firstAttempt=true;render()};return}
 const t=tasks[idx];app.innerHTML=`<div class="top"><div><div class="eyebrow">Mathematik · Zehnerzahlen</div><h1>⚡ Kopfrechen-Challenge</h1></div><div class="count">${idx+1} / ${tasks.length}</div></div><div class="progress" aria-label="Fortschritt"><div style="width:${idx/tasks.length*100}%"></div></div><div class="question" aria-label="Rechenaufgabe">${t.a} ${t.op} ${t.b} = ?</div><div class="actions"><button type="button" class="secondary" id="tipBtn" aria-expanded="${tip}">💡 ${tip?'Tipp ausblenden':'Tipp anzeigen'}</button></div>${tip?`<div class="tip" id="tip"><div>Deine kleine Aufgabe:</div><strong>${t.small}</strong><p>Überlege: Wie hilft dir das bei den Zehnern?</p></div>`:''}<label for="answer" style="display:block;margin-top:20px;font-weight:800">Dein Ergebnis:</label><form class="answer" id="form"><input id="answer" type="number" min="0" max="100" step="10" inputmode="numeric" autocomplete="off" ${done?'disabled':''} aria-label="Ergebnis eingeben" required><button class="primary" id="check" type="submit" ${done?'disabled':''}>Prüfen</button></form><div class="feedback" id="feedback" role="status">${done?'<span class="good">✓ Richtig gerechnet!</span>':''}</div>${done?'<div class="actions"><button class="primary" id="next">'+(idx===tasks.length-1?'Ergebnis ansehen':'Nächste Aufgabe →')+'</button></div>':''}<div class="footer">Du darfst dir jederzeit einen Tipp holen. 🌟</div>`;
 document.getElementById('tipBtn').onclick=()=>{const current=document.getElementById('answer')?.value||'';tip=!tip;render();const input=document.getElementById('answer');if(input&&!done)input.value=current};
 if(!done)document.getElementById('form').onsubmit=e=>{e.preventDefault();const input=document.getElementById('answer');if(input.value.trim()==='')return;const value=Number(input.value);if(value===solution(t)){if(firstAttempt)firstTryCorrect++;done=true;render()}else{firstAttempt=false;document.getElementById('feedback').innerHTML='<span class="retry">Noch nicht richtig. Versuche es erneut oder nutze den Tipp! 💪</span>';input.select()}};
 if(done)document.getElementById('next').onclick=()=>{idx++;tip=false;done=false;firstAttempt=true;render()};
}
render();
</script></body></html>
